name: backend-ci
on:
  push:
    paths:
      - 'cruze-backend/**'
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install
        working-directory: cruze-backend
        run: npm install
      - name: Lint & Build
        working-directory: cruze-backend
        run: node -e "console.log('ok')" # add your lint/build here
