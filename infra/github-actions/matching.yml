name: matching-ci
on:
  push:
    paths:
      - 'cruze-matching/**'
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install
        working-directory: cruze-matching
        run: pip install -r requirements.txt
      - name: Smoke
        working-directory: cruze-matching
        run: python - <<'PY'
print('ok')
PY
